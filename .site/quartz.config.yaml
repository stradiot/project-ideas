# Quartz configuration for the published vault.
#
# Derived from quartz.config.default.yaml at tag v5.0.0 — the tag pinned in
# build.sh. Keep the plugin list in sync with that file: the upstream
# quartz.lock.json pins every plugin listed there, and a source: line that is
# not in the lockfile has to be fetched unpinned. Toggle `enabled` and options
# rather than adding or removing entries.
#
# Note the tag and the v5 branch head disagree on plugin source syntax
# (github:quartz-community/... vs @quartz-community/...) and on which plugins
# exist. This file uses the tag's syntax. Bumping QUARTZ_TAG means re-deriving
# this file from that tag's default config.

# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: project-ideas
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  # No third-party analytics script on any page.
  analytics: null
  locale: en-US
  # Must carry the GitHub Pages subpath, no protocol and no slashes, or the
  # sitemap, RSS feed and OG image URLs all point at the wrong host.
  baseUrl: stradiot.github.io/project-ideas
  # Redundant given that build.sh only copies projects/, notes/ and journal/,
  # kept in case that copy list ever widens.
  ignorePatterns:
    - templates
    - .obsidian
  # Project and reference notes carry `created:` in the vault. Logs and journal
  # notes do not, and the filesystem fallback is useless here — build.sh copies
  # the vault, so every birthtime is the instant of the copy. stamp-dates.py
  # synthesises one for them on that copy instead.
  defaultDateType: created
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#b3aa0288"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      # git is dropped deliberately: build.sh copies content into a scratch
      # clone, so commit timestamps do not reach the files Quartz reads.
      priority:
        - frontmatter
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      # 302 `## Plan` checkboxes across the project notes depend on this.
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  # Off: the vault has no math. Checked by stripping code fences and inline
  # code and looking for $...$ spans — zero across all 64 files. Costs 153 MB
  # of katex to install for nothing. Turn back on if a note ever needs math.
  - source: github:quartz-community/latex
    enabled: false
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: false
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  # Off deliberately. It derives a CNAME file from baseUrl by stripping the
  # path, which here yields `stradiot.github.io` — GitHub Pages would read that
  # as a custom-domain request for the user site and break this deployment.
  # Turn it back on only alongside a real custom domain.
  - source: github:quartz-community/cname
    enabled: false
  # Off: no .canvas files in the vault.
  - source: github:quartz-community/canvas-page
    enabled: false
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    layout:
      position: left
      priority: 50
  - source: github:quartz-community/graph
    enabled: true
    layout:
      position: right
      priority: 10
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/footer
    enabled: true
    options:
      links:
        GitHub: https://github.com/stradiot/project-ideas
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  # Off: no .base files in the vault.
  - source: github:quartz-community/bases-page
    enabled: false
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      # The state fields the vault actually tracks, so `status:` and `depends:`
      # are visible on the page rather than buried in frontmatter.
      #
      # `created` is deliberately absent: content-meta already prints it under
      # the title on every page, and stamp-dates.py now synthesises one for the
      # logs and journal notes, so listing it here put the same date on a daily
      # note three times over — as the title, as a property, and as the meta
      # line.
      includedProperties:
        - status
        - depends
        - repo
        - github
        - tags
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      visibility: icon
      iterations: 600000
      passwordField: password
    order: 900
    layout:
      position: body
      priority: 100
      display: all
  # Off: an optional side-by-side reading UI, not navigation. It also carries
  # the same root-absolute contentIndex fetch as the explorer, in a compiled
  # form the patch in build.sh does not match, so it would stay broken here.
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
